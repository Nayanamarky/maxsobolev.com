<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX SOBOLEV — CG / VFX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0e;--panel:#131519;--line:#23262c;--ink:#e9ebee;--dim:#7a8089;--scrub:#d7e3ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .mono{font-family:"JetBrains Mono",monospace}

  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
    padding:20px 22px;background:linear-gradient(var(--bg),rgba(11,12,14,.75) 70%,rgba(11,12,14,0))}
  .brand .name{font-weight:700;letter-spacing:.06em;font-size:15px;line-height:1}
  .brand .role{font-size:10px;letter-spacing:.22em;color:var(--dim);margin-top:5px}

  .menuzone{position:relative}
  .burger{width:40px;height:40px;border:1px solid var(--line);border-radius:2px;background:transparent;
    display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s}
  .burger:hover{border-color:var(--dim)}
  .burger span{width:16px;height:1.5px;background:var(--ink);transition:.25s}
  .burger.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
  .burger.open span:nth-child(2){opacity:0}
  .burger.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

  /* выпадающее меню у бургера */
  .dropdown{position:absolute;top:52px;right:0;width:230px;background:var(--panel);
    border:1px solid var(--line);border-radius:4px;padding:8px;opacity:0;transform:translateY(-6px) scale(.98);
    transform-origin:top right;pointer-events:none;transition:.2s;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .dropdown.open{opacity:1;transform:none;pointer-events:auto}
  .dropdown a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:3px;
    font-size:15px;color:var(--ink);transition:background .15s}
  .dropdown a:hover{background:#1c1f25}
  .dropdown a .en{font-size:9px;letter-spacing:.2em;color:var(--dim)}
  .dropdown .sep{height:1px;background:var(--line);margin:6px 8px}
  .dropdown .foot{font-size:9px;letter-spacing:.16em;color:var(--dim);padding:8px 12px 4px}

  .filters{display:flex;gap:2px;padding:0 22px 14px;flex-wrap:wrap}
  .filters button{font-family:inherit;font-size:11px;letter-spacing:.14em;color:var(--dim);
    background:transparent;border:none;padding:6px 12px 6px 0;cursor:pointer;transition:color .2s}
  .filters button:hover,.filters button.active{color:var(--ink)}
  .filters button.active::after{content:"";display:block;height:1px;background:var(--scrub);margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}

  .tile{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--panel);cursor:pointer;isolation:isolate}
  .tile.hidden{display:none}
  .tile .frame{position:absolute;inset:0;background-size:200% 200%;background-position:20% 30%;
    transition:filter .4s,transform .4s;filter:saturate(.85) brightness(.92)}
  .tile:hover .frame{filter:saturate(1.05) brightness(1.05);transform:scale(1.02)}
  .tile .veil{position:absolute;inset:0;z-index:2;
    background:linear-gradient(180deg,rgba(6,7,9,.05),rgba(6,7,9,.72));opacity:.5;transition:opacity .35s}
  .tile:hover .veil{opacity:.92}
  .tile .meta{position:absolute;left:16px;bottom:14px;right:16px;z-index:3}
  .tile .title{font-size:19px;font-weight:500;transform:translateY(6px);opacity:0;transition:.35s}
  .tile:hover .title{transform:none;opacity:1}
  .tile .sub{font-size:10px;letter-spacing:.16em;color:var(--dim);margin-top:6px;text-transform:uppercase;opacity:0;transition:.35s .05s}
  .tile:hover .sub{opacity:1}
  .tile .idx{position:absolute;left:14px;top:12px;z-index:3;font-size:10px;color:#cfd4da;letter-spacing:.12em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .tile .scrubwrap{position:absolute;left:0;right:0;bottom:0;z-index:4;opacity:0;transition:opacity .3s}
  .tile:hover .scrubwrap{opacity:1}
  .tile .tc{position:absolute;right:12px;bottom:12px;font-size:10px;color:var(--scrub);letter-spacing:.08em}
  .tile .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--scrub)}

  /* кнопка наверх */
  .totop{position:fixed;right:22px;bottom:22px;z-index:45;width:44px;height:44px;border-radius:3px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s}
  .totop.show{opacity:1;transform:none;pointer-events:auto}
  .totop:hover{border-color:var(--dim)}

  footer{padding:40px 22px;font-size:11px;letter-spacing:.14em;color:var(--dim);text-align:center}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const projects=[
  {t:"Dad's Rigs",c:"Nike · 2025",cat:["vfx","cg"]},
  {t:"Fold-A-Flame",c:"Zippo · 2025",cat:["cg"]},
  {t:"On Becoming A God",c:"HBO · 2024",cat:["vfx","direction"]},
  {t:"X-Games",c:"ESPN · 2024",cat:["realtime"]},
  {t:"NFL — DNA",c:"NFL · 2024",cat:["cg","vfx"]},
  {t:"Gift Of Go",c:"Apple Watch · 2023",cat:["direction"]},
  {t:"Powerpath",c:"Samsung · 2023",cat:["realtime","cg"]},
  {t:"Color Bars",c:"Apple TV · 2023",cat:["vfx"]},
  {t:"Every Color",c:"iPhone 5c · 2022",cat:["cg"]},
  {t:"Make It Count",c:"HBO · 2022",cat:["direction","vfx"]},
  {t:"Unity",c:"Shot on iPhone · 2022",cat:["realtime"]},
  {t:"Sourced",c:"Starbucks · 2021",cat:["cg","direction"]},
];
const grid=document.getElementById('grid');
projects.forEach((p,i)=>{
  const el=document.createElement('a');
  el.href="#";el.className="tile";el.dataset.cat=p.cat.join(" ");
  el.innerHTML=`
    <div class="frame" style="background-image:url('${frames[i%frames.length]}')"></div>
    <div class="veil"></div>
    <div class="idx mono">${String(i+1).padStart(2,'0')} / ${projects.length}</div>
    <div class="meta"><div class="title">${p.t}</div><div class="sub mono">${p.c}</div></div>
    <div class="scrubwrap"><div class="bar"></div><div class="tc mono">00:00:00</div></div>`;
  grid.appendChild(el);
  const frame=el.querySelector('.frame'),bar=el.querySelector('.bar'),tc=el.querySelector('.tc');
  let raf=null,start=null;
  el.addEventListener('mouseenter',()=>{start=performance.now();tick();});
  el.addEventListener('mouseleave',()=>{cancelAnimationFrame(raf);bar.style.width="0";tc.textContent="00:00:00";frame.style.backgroundPosition="20% 30%";});
  el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;
    frame.style.backgroundPosition=`${20+x*60}% ${30+x*20}%`;bar.style.width=(x*100)+"%";});
  function tick(){const ms=performance.now()-start;const f=Math.floor(ms/41.7)%24;const s=Math.floor(ms/1000)%60;
    tc.textContent=`00:00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;raf=requestAnimationFrame(tick);}
});

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  const f=b.dataset.f;
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('hidden',f!=='all'&&!t.dataset.cat.split(" ").includes(f)));
});

const dd=document.getElementById('dropdown'),bg=document.getElementById('burger');
function toggle(open){dd.classList.toggle('open',open);bg.classList.toggle('open',open);}
bg.addEventListener('click',e=>{e.stopPropagation();toggle(!dd.classList.contains('open'));});
document.addEventListener('click',e=>{if(!dd.contains(e.target))toggle(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false);});

const tt=document.getElementById('totop');
window.addEventListener('scroll',()=>tt.classList.toggle('show',window.scrollY>400));
tt.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
</script>
